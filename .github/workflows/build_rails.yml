name: Test superglue_rails
on:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit - Ruby ${{ matrix.ruby }}. Rails ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "3.3"]
        version: ["80", "81"]
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Which bundler?
        run: bundle -v
      - name: Which chromedriver?
        run: chromedriver -v
      - name: Using Gemfile
        run: |
          mv -f Gemfile.${{ matrix.version }} ./Gemfile
      - name: npm install on dummy app
        run: cd test/dummy && npm install && npm run build
      - name: Bundle install
        run: bundle install
      - name: Run unit test
        run: bundle exec rake test
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit_run${{ matrix.ruby }}${{ matrix.version }}
          path: test/dummy/tmp/screenshots/
          retention-days: 7

  acceptance:
    name: Acceptance - ${{ matrix.bundler }}${{ matrix.typescript == '1' && ' (TS)' || '' }}${{ matrix.validator != 'none' && format(' {0}', matrix.validator) || '' }}${{ matrix.svgr == '1' && ' svgr' || '' }}
    strategy:
      fail-fast: false
      matrix:
        bundler: [esbuild, bun, webpack, rollup]
        typescript: ["0", "1"]
        validator: ["none"]
        svgr: ["0"]
        # The generator's defaults: a validator picked from TypeScript (typia
        # on a fresh app) and SVGR. deepkit covers the other validator on
        # esbuild and on rollup, whose plugin order decides whether it sees
        # the TypeScript source. ttsc bundles its own Go toolchain, so no
        # setup-go.
        include:
          - { bundler: esbuild, typescript: "1", validator: auto, svgr: "1" }
          - { bundler: bun, typescript: "1", validator: auto, svgr: "1" }
          - { bundler: webpack, typescript: "1", validator: auto, svgr: "1" }
          - { bundler: rollup, typescript: "1", validator: auto, svgr: "1" }
          - { bundler: esbuild, typescript: "1", validator: deepkit, svgr: "1" }
          - { bundler: rollup, typescript: "1", validator: deepkit, svgr: "1" }
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          repository: thoughtbot/superglue
          ref: v2
          path: superglue
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        if: matrix.bundler == 'bun'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Bundle install
        run: bundle install
      - name: Run acceptance test
        run: >
          BUNDLE_GEMFILE=''
          SUPERGLUE_DIR=${{ github.workspace }}/superglue
          USE_TYPESCRIPT=${{ matrix.typescript }}
          VALIDATOR=${{ matrix.validator }}
          USE_SVGR=${{ matrix.svgr }}
          ruby -Ilib:test test/acceptance/superglue_installation_acceptance.rb
          --name test_ssr_with_${{ matrix.bundler }}
      - name: Kill orphaned processes
        if: always()
        run: lsof -ti:3000 | xargs kill -9 2>/dev/null || true

  acceptance-e2e:
    name: Acceptance - E2E${{ matrix.typescript == '1' && ' (TS)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        typescript: ["0", "1"]
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          repository: thoughtbot/superglue
          ref: v2
          path: superglue
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Which chromedriver?
        run: chromedriver -v
      - name: Bundle install
        run: bundle install
      - name: Run E2E test
        run: >
          BUNDLE_GEMFILE=''
          SUPERGLUE_DIR=${{ github.workspace }}/superglue
          USE_TYPESCRIPT=${{ matrix.typescript }}
          ruby -Ilib:test test/acceptance/superglue_installation_acceptance.rb
          --name test_installation
      - name: Kill orphaned processes
        if: always()
        run: lsof -ti:3000 | xargs kill -9 2>/dev/null || true
