name: Test superglue_rails
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Ruby ${{ matrix.ruby }}. Rails ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "3.3"]
        version: ["80", "81"]
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 23.10.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Which bundler?
        run: bundle -v
      - name: Which chromedriver?
        run: chromedriver -v
      - name: Using Gemfile
        run: |
          mv -f Gemfile.${{ matrix.version }} ./Gemfile
      - name: npm install on dummy app
        run: cd test/dummy && npm install && npm run build
      - name: Bundle install
        run: bundle install
      - name: Run unit test
        run: bundle exec rake test
      - name: Run acceptance test
        run: BUNDLE_GEMFILE='' ruby -Ilib:test test/acceptance/superglue_installation_acceptance.rb
      - name: Kill orphaned processes
        if: always()
        run: lsof -ti:3000 | xargs kill -9 2>/dev/null || true
      - name: Run acceptance test w/ typescript
        run: BUNDLE_GEMFILE='' USE_TYPESCRIPT=1 ruby -Ilib:test test/acceptance/superglue_installation_acceptance.rb
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superglue_rails_run${{ matrix.ruby }}${{ matrix.version }}
          path: test/dummy/tmp/screenshots/
          retention-days: 7
